<!DOCTYPE html>
<!-- RAG ビューワの 1 枚。uniqnode viewer が / でこのまま返す。
     外部資源(CDN・フォント・画像)を一切参照しないので、繋がっていない機械でも開ける。
     問い合わせ先は同じ生成元の /v1/* だけで、その先は viewer が serve へ転送する。
     紙面のサムネも、そのページの PDF も、この /v1/objects/{id}/rendition/… から来る
     (外から取ってくる画像は一枚も無い)。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uniqnode viewer</title>
<style>
  :root {
    color-scheme: light dark;
    --line: color-mix(in srgb, currentColor 18%, transparent);
    --dim: color-mix(in srgb, currentColor 62%, transparent);
    --panel: color-mix(in srgb, currentColor 5%, transparent);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 1.2rem; max-width: 60rem;
    font: 15px/1.65 system-ui, -apple-system, "Noto Sans JP", sans-serif;
  }
  h1 { font-size: 1.1rem; margin: 0; }
  header { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
           border-bottom: 1px solid var(--line); padding-bottom: .6rem; }
  #node { color: var(--dim); font-size: .8rem; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .9rem 0; }
  #query { flex: 1 1 22rem; }
  /* 背景と文字は色の組で指定する。片方だけ(たとえば背景 transparent)にすると、
     開いた選択肢が地の色を失い、暗い配色で白地に白文字になる。Canvas / CanvasText は
     :root の color-scheme に追従するシステム色なので、明暗のどちらでも噛み合う。 */
  input, select, button { font: inherit; padding: .4rem .55rem;
                          border: 1px solid var(--line); border-radius: 6px;
                          background: Canvas; color: CanvasText; }
  /* 開いた選択肢は別の描画面に出るので、頁の色は継がない。ここでも組で指定する。 */
  option { background: Canvas; color: CanvasText; }
  button { cursor: pointer; background: var(--panel); color: CanvasText; }
  button:disabled { opacity: .5; cursor: default; }
  label { display: flex; align-items: center; gap: .3rem; color: var(--dim); font-size: .85rem; }
  #notices:empty { display: none; }
  .notice { border-left: 3px solid var(--line); padding: .35rem .6rem; margin: .35rem 0;
            background: var(--panel); font-size: .87rem; }
  .hit { border-top: 1px solid var(--line); padding: .8rem 0;
         display: flex; gap: .8rem; flex-wrap: wrap; }
  .body { flex: 1 1 22rem; min-width: 0; }
  /* 写し(紙面のサムネと、その頁へ行く道)。参照先はどれも同じ生成元の /v1/objects/… で
     ある。件の左に置き、拡大したときだけ行いっぱいに広げる。 */
  .media { flex: 0 0 9rem; display: flex; flex-direction: column; gap: .25rem;
           font-size: .78rem; }
  .media.big { flex: 1 1 100%; }
  .media img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px;
               background: var(--panel); cursor: zoom-in; }
  .media.big img { cursor: zoom-out; }
  .media .why { color: var(--dim); }
  .cite { display: flex; gap: .5rem; flex-wrap: wrap; align-items: baseline; }
  .doc { font-weight: 600; }
  .meta, .crumbs, .chunk { color: var(--dim); font-size: .82rem; }
  .chunk { font-family: ui-monospace, monospace; word-break: break-all; }
  .snippet { margin: .35rem 0 .45rem; white-space: pre-wrap; }
  .full { white-space: pre-wrap; background: var(--panel); border-radius: 6px;
          padding: .7rem; margin-top: .5rem; font-size: .92rem; }
  .full:empty { display: none; }
  footer { color: var(--dim); font-size: .8rem; border-top: 1px solid var(--line);
           margin-top: 1.4rem; padding-top: .6rem; }
</style>
</head>
<body>
<header>
  <h1>uniqnode viewer</h1>
  <span id="node">読み込み中…</span>
</header>

<form id="form">
  <input id="query" placeholder="問い(文書が使う語をそのまま入れると当たりやすい)" autofocus>
  <select id="collection"><option value="">全コレクション</option></select>
  <select id="method">
    <option value="">方式: 既定</option>
    <option value="bm25">bm25(語の一致)</option>
    <option value="embedding">embedding(意味の近さ)</option>
    <option value="hybrid">hybrid(RRF 融合)</option>
  </select>
  <label>件数 <input id="topk" type="number" value="10" min="1" max="100" style="width:4.5rem"></label>
  <label><input id="lowinfo" type="checkbox"> 低情報も出す</label>
  <button id="go">検索</button>
</form>

<div id="notices"></div>
<div id="results"></div>

<footer>
  出典の取得日時は、その版をこのDBノードの見えに置いた ref レコードの時刻(原典が書かれた
  時刻ではない)。得点は同じ応答の中の順位付けにだけ意味があり、応答をまたいだ比較には使えない。
</footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// 応答の JSON を取る。誤りは呼び手が画面に出す(黙って空を返さない)。
async function api(path, options) {
  const response = await fetch(path, options);
  const text = await response.text();
  if (!response.ok) throw new Error(`${path} が ${response.status}: ${text.slice(0, 200)}`);
  return text;
}

function escapeText(value) {
  return String(value).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// unix 秒を UTC で描く(MCP アダプタと同じ描き方)。
function formatTime(seconds) {
  return new Date(seconds * 1000).toISOString().replace(/\.\d+Z$/, "Z");
}

function notice(text) {
  const div = document.createElement("div");
  div.className = "notice";
  div.textContent = text;
  $("notices").append(div);
}

// 起動時: このDBノードの素性と、コレクションの一覧を出す。
async function loadNode() {
  try {
    const status = JSON.parse(await api("/v1/status"));
    $("node").textContent =
      `node ${status.node_id.slice(0, 12)}… / オブジェクト ${status.objects.toLocaleString()} 件`;
    const refs = JSON.parse(await api("/v1/refs")).refs || [];
    const collections = new Set();
    for (const ref of refs) {
      if (!ref.target) continue;                       // tombstone は見えにない
      const path = ref.name.split("/").slice(1).join("/");
      if (path.startsWith("collections/")) collections.add(path.split("/")[1]);
    }
    for (const name of [...collections].sort()) {
      const option = document.createElement("option");
      option.value = option.textContent = name;
      $("collection").append(option);
    }
  } catch (error) {
    $("node").textContent = "serve に届かない";
    notice(`${error.message}(uniqnode serve <dir> <addr> で起こす)`);
  }
}

// ---- 問いを道に残す(リロードと戻るで同じ画面が出るように) ----
//
// 画面の状態は入力欄そのものである。それを道の問い合わせ部分に写しておけば、リロードは
// 同じ検索をやり直すだけで同じ画面になる。結果そのものは残さない(残すと、ストアが
// 変わった後の再読み込みで古い順位を復元してしまう)。
// 欄の名は要求の欄と同じにする(q だけは query が要求側の名なので短く採る)。

/// いまの入力欄を道に写す。
function formToUrl() {
  const params = new URLSearchParams();
  params.set("q", $("query").value.trim());
  if ($("collection").value) params.set("collection", $("collection").value);
  if ($("method").value) params.set("method", $("method").value);
  if ($("topk").value && $("topk").value !== "10") params.set("top_k", $("topk").value);
  if ($("lowinfo").checked) params.set("include_low_information", "1");
  return `?${params}`;
}

/// 道の問い合わせ部分を入力欄に写す。問いがあれば true(呼び手が検索を投げる)。
function urlToForm() {
  const params = new URLSearchParams(location.search);
  const query = params.get("q") || "";
  $("query").value = query;
  // コレクションの選択肢はまだ揃っていないことがある(loadNode が先に終わるとは限らない)。
  // 値をそのまま入れておけば、選択肢が足された時点で選ばれた状態になる。
  $("collection").value = params.get("collection") || "";
  $("method").value = params.get("method") || "";
  $("topk").value = params.get("top_k") || "10";
  $("lowinfo").checked = params.get("include_low_information") === "1";
  return query !== "";
}

// 検索 1 回。判断(方式の既定・劣化・引用)は serve の側にあり、ここは描くだけである。
async function search(event) {
  if (event) event.preventDefault();
  const query = $("query").value.trim();
  if (!query) return;
  // 道を今の問いに合わせる。押すたびに履歴を積むので、戻るで前の問いへ帰れる
  // (同じ問いを押し直したときは積まない)。
  const url = formToUrl();
  if (event && url !== location.search) history.pushState(null, "", url);
  $("notices").textContent = "";
  $("results").textContent = "検索中…";
  $("go").disabled = true;
  const request = { query, top_k: Number($("topk").value) || 10 };
  if ($("collection").value) request.collection = $("collection").value;
  if ($("method").value) request.method = $("method").value;
  if ($("lowinfo").checked) request.include_low_information = true;
  try {
    const body = JSON.parse(await api("/v1/search", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(request),
    }));
    render(body);
  } catch (error) {
    $("results").textContent = "";
    notice(error.message);
  } finally {
    $("go").disabled = false;
  }
}

function render(body) {
  const hits = body.results || [];
  notice(`方式 ${body.method}(得点の意味 ${body.score_semantics})、${hits.length} 件`);
  // 黙って劣化しない・黙って捨てない: serve が言ったことをそのまま画面にも出す。
  if (body.degraded) notice(`劣化: ${body.degraded}`);
  if (body.filtered_low_information) {
    notice(`低情報チャンク ${body.filtered_low_information} 件を応答から落とした`
           + "(目次の紙面・柱だけ・ページ番号だけ。「低情報も出す」で戻る)");
  }
  $("results").textContent = "";
  if (hits.length === 0) {
    $("results").textContent = "一致なし。ここに無いことは、世界に無いことを意味しない。";
    return;
  }
  const entries = [];
  hits.forEach((hit, index) => {
    const cite = hit.citation || {};
    const page = cite.page === undefined ? "" : ` p.${cite.page}`;
    const crumbs = (cite.breadcrumbs || []).join(" > ");
    const div = document.createElement("div");
    div.className = "hit";
    div.innerHTML = `
      <div class="body">
      <div class="cite">
        <span class="doc">${index + 1}. ${escapeText(cite.collection)}/${escapeText(cite.document)}${escapeText(page)}</span>
        <span class="meta">位置 ${cite.position} / 取得 ${formatTime(cite.at)} / 得点 ${hit.score.toFixed(4)}</span>
      </div>
      ${crumbs ? `<div class="crumbs">見出し: ${escapeText(crumbs)}</div>` : ""}
      <div class="snippet">${escapeText(hit.snippet)}</div>
      <div class="cite">
        <button type="button">全文</button>
        <span class="chunk">${escapeText(hit.id)}</span>
      </div>
      <div class="full"></div>
      </div>`;
    div.querySelector("button").addEventListener("click", (event) => showFull(hit.id, div, event));
    $("results").append(div);
    entries.push({ id: hit.id, page: cite.page, div });
  });
  // 写しは描き終えてから足す(検索結果そのものは、写しの口が無くても出る)。
  attachRenditions(entries);
}

// ---- 紙面の写し(PDF 由来の件だけ) ----
//
// serve の口は二つ。目録 /v1/objects/{id}/rendition は何も生成せず、その件でどの写しが
// 出せるかを言う。写しそのもの /v1/objects/{id}/rendition/{別名} は、無ければその場で
// 作って返す。別名は 4 つ(source・thumb・page・pagepdf)で、ビューワ側の許可表と同じ
// である。

// 目録を引く件数の上限。写しは要求されたときに作られるので、10 件ぶんを一度に頼まない。
// 上位の数件だけ引き、残りには同じ形を当てて、画像は loading="lazy" に任せる。
const RENDITION_PROBE_LIMIT = 3;

// 頁が自分で組み立てる道。ID はそのまま path に置く(全文を取る道と同じ理由で、
// パーセント符号化しない: 受け側の ID の形の検査に落ちて 404 になる)。
function renditionUrls(id) {
  return {
    catalog: `/v1/objects/${id}/rendition`,
    source: `/v1/objects/${id}/rendition/source`,
    thumb: `/v1/objects/${id}/rendition/thumb`,
    page: `/v1/objects/${id}/rendition/page`,
    pagepdf: `/v1/objects/${id}/rendition/pagepdf`,
  };
}

// 目録 1 件。別名で引ける形に直して返す。PDF 由来でない件は null(出せないものの席を
// 作らない)。届かない・口が無いときは投げる(どうするかは呼び手が決める)。
async function loadCatalog(id) {
  const catalog = JSON.parse(await api(renditionUrls(id).catalog));
  if (catalog.media !== "pdf") return null;
  const views = {};
  for (const view of catalog.views || []) views[view.alias] = view;
  return views;
}

// serve から来た文言(出せない理由・注記)は、地の文としてその場に出す。値はテキストの
// 位置にしか入らないので、文言に < が混じっても頁の上では走らない。
function why(label, text) {
  const div = document.createElement("div");
  div.className = "why";
  div.textContent = `${label}: ${text || "(理由なし)"}`;
  return div;
}

function pageLink(href, label) {
  const anchor = document.createElement("a");
  anchor.href = href;
  anchor.target = "_blank";
  anchor.rel = "noopener";
  anchor.textContent = label;
  return anchor;
}

// 1 件ぶんの写しの箱。views は目録の views を別名で引ける形にしたもの。
// state が unavailable の項は隠さず、理由をその場に出す(空の箱にしない)。
function renditionBox(entry, views) {
  const urls = renditionUrls(entry.id);
  const box = document.createElement("div");
  box.className = "media";
  const thumb = views.thumb || {};
  const zoom = views.page || {};
  if (thumb.state === "unavailable") {
    box.append(why("サムネを出せない", thumb.reason));
  } else {
    const img = document.createElement("img");
    img.loading = "lazy";                       // 下の件の画像は、見えたときに取りに行く
    img.alt = `p.${entry.page} の紙面`;
    img.src = urls.thumb;
    box.append(img);
    if (zoom.state === "unavailable") {
      img.style.cursor = "default";             // 押しても何も起きないものを押せそうに見せない
      box.append(why("拡大を出せない", zoom.reason));
    } else {
      // 押したときだけ拡大用の PNG(0.4 秒・371KB)に差し替える。もう一度押すと戻る。
      img.addEventListener("click", () => {
        img.src = box.classList.toggle("big") ? urls.page : urls.thumb;
      });
    }
  }
  // 原本 PDF の当該ページ。何も生成しないので、poppler の無い機械でも必ず開く。
  const source = views.source || {};
  if (source.state === "unavailable") {
    box.append(why("原本を出せない", source.reason));
  } else {
    box.append(pageLink(`${urls.source}#page=${entry.page}`, `原本 PDF の p.${entry.page}`));
  }
  // そのページだけの PDF。注記(再描画であることなど)は目録の文言をそのまま添える。
  const only = views.pagepdf || {};
  if (only.state === "unavailable") {
    box.append(why("このページだけの PDF を出せない", only.reason));
  } else {
    box.append(pageLink(urls.pagepdf, "このページだけの PDF"));
    if (only.note) box.append(why("注", only.note));
  }
  return box;
}

// 描き終えた結果に写しを足す。目録の口が無い serve(旧版)では何も足さず、従来どおりの
// 画面のままにする(壊れた見た目を作らない)。
async function attachRenditions(entries) {
  // PDF 由来の徴は引用のページ番号である(markdown・text の件には page が無い)。
  const pdf = entries.filter((entry) => entry.page !== undefined);
  let shape = null;
  for (const entry of pdf.slice(0, RENDITION_PROBE_LIMIT)) {
    let views;
    try {
      views = await loadCatalog(entry.id);
    } catch {
      return;                 // 目録の口が無い(旧 serve)・届かない: 何も足さない
    }
    if (!views) continue;     // PDF 由来でない件
    shape = shape || views;
    entry.div.prepend(renditionBox(entry, views));
  }
  if (!shape) return;
  // 残りの件は目録を引かない。どの写しが出せるか(と、出せない理由)はレシピと機械の
  // 性質で決まるので、同じ機械の上では件ごとに変わらない。道は ID から組み立てる。
  for (const entry of pdf.slice(RENDITION_PROBE_LIMIT)) {
    entry.div.prepend(renditionBox(entry, shape));
  }
}

// 全文はチャンクのオブジェクトそのものを取り、本文だけを出す(チャンクでなければ生のまま)。
async function showFull(id, div, event) {
  const target = div.querySelector(".full");
  if (target.textContent) { target.textContent = ""; event.target.textContent = "全文"; return; }
  target.textContent = "取得中…";
  try {
    // ID はそのまま path に置く。API のパスは生のまま扱う規約(パーセントデコードしない)
    // なので、`s256:` のコロンを %3A に直すと、ID の形の検査に落ちて 404 になる。
    // 形(s256: と 16 進 64 桁)は受け側が確かめる。
    const raw = await api(`/v1/objects/${id}`);
    let text = raw;
    try {
      const object = JSON.parse(raw);
      if (object && typeof object.text === "string") text = object.text;
    } catch { /* チャンクでない・c1 でないものは生のまま出す */ }
    target.textContent = text;
    event.target.textContent = "閉じる";
  } catch (error) {
    target.textContent = error.message;
  }
}

$("form").addEventListener("submit", search);
// 戻る・進むでも同じ規律で復元する(道が状態の正典であり、履歴はその列である)。
window.addEventListener("popstate", () => { if (urlToForm()) search(null); else $("results").textContent = ""; });
loadNode();
// 道に問いが載っていれば、そのまま同じ検索をやり直す(リロードで画面が変わらない)。
// loadNode を待たない: コレクションの選択肢は後から足されても、選ばれた値は保たれる。
if (urlToForm()) search(null);
</script>
</body>
</html>
